name: Lint Helm Chart

# No paths filter: this check is required by the 'main protection' ruleset, so
# it has to report on every pull request. A filtered check never reports on a
# PR that misses the filter, which leaves that PR permanently unmergeable.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint chart
        run: helm lint ntp-exporters

      - name: Render templates
        run: helm template ntp-exporters ntp-exporters
