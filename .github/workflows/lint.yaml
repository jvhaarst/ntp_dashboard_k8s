name: Lint Helm Chart

# No paths filter: this check is required by the 'main protection' ruleset, so
# it has to report on every pull request. A filtered check never reports on a
# PR that misses the filter, which leaves that PR permanently unmergeable.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint chart
        run: helm lint ntp-exporters

      - name: Render templates
        run: helm template ntp-exporters ntp-exporters > rendered.yaml

      # helm lint does not parse its own output. A value containing a colon can
      # render as valid-looking YAML that loads as a map instead of a string,
      # which the API server rejects only at apply time.
      - name: Check rendered manifests parse as expected
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'EOF'
          import sys, yaml

          bad = []
          for doc in yaml.safe_load_all(open("rendered.yaml")):
              if not doc or doc.get("kind") not in (
                  "DaemonSet", "Deployment", "StatefulSet", "Job", "CronJob", "Pod"
              ):
                  continue
              spec = doc["spec"]["template"]["spec"]
              for c in spec.get("initContainers", []) + spec.get("containers", []):
                  for field in ("command", "args"):
                      for i, entry in enumerate(c.get(field, [])):
                          if not isinstance(entry, str):
                              bad.append(
                                  f"{doc['kind']}/{doc['metadata']['name']} "
                                  f"{c['name']}.{field}[{i}] is {type(entry).__name__}, "
                                  f"not str: {entry!r}"
                              )

          if bad:
              print("Rendered manifests have non-string command/args entries:")
              for b in bad:
                  print("  " + b)
              print("Quote the value in the template.")
              sys.exit(1)
          print("Rendered manifests OK")
          EOF
