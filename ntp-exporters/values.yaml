# Deploys chrony_exporter and gpsd-prometheus-exporter onto the node that runs
# chronyd and gpsd, plus the VictoriaMetrics scrape config, recording/alerting
# rules and Grafana dashboards that consume them.
#
# Both daemons listen on loopback only, so the pod runs with hostNetwork: true
# and reaches them at [::1]:323 and localhost:2947 on the host itself.

nameOverride: ""
fullnameOverride: ""

# Pin to the node that owns the GNSS receiver and the PPS signal.
nodeSelector:
  kubernetes.io/hostname: ntp

tolerations:
  - key: longhorn.io/exclude
    operator: Equal
    value: "true"
    effect: NoSchedule

podAnnotations: {}
podLabels: {}
priorityClassName: ""
imagePullSecrets: []

chronyExporter:
  enabled: true
  image:
    repository: quay.io/superq/chrony-exporter
    tag: v0.14.0
    pullPolicy: IfNotPresent
  # Host port for the exporter. Under hostNetwork this is a real port on the node.
  port: 9123
  # chronyd answers `tracking`, `sources` and `sourcestats` over UDP 323, but
  # refuses `serverstats` and `clients` there with "501 Not authorised". Those
  # two only work over the unix command socket, so that is the default.
  # Use "[::1]:323" instead to talk UDP and give up those two collectors.
  address: "unix:///run/chrony/chronyd.sock"
  socket:
    # Mount the host directory that holds chronyd.sock. Required whenever
    # address is a unix:// path.
    enabled: true
    hostPath: /run/chrony
    # The directory is mode 750 owned by chronyd's user, so the container has to
    # run as that user. On Debian it is _chrony, but the ids are allocated when
    # the package is installed and are NOT the same on every host: check with
    # `id _chrony` on the node and set these to match.
    runAsUser: 115
    runAsGroup: 124
  collectors:
    tracking: true
    sources: true
    sourcestats: true
    serverstats: true
    # Requires chrony >= 4.0. Counts saturate at clientloglimit, so raise that
    # on the host if the server has many clients.
    clients: true
    # Requires the chronyd unix socket, root, and --collector.chmod-socket.
    # Off by default so the container can stay unprivileged and non-root.
    sourcesWithNtpdata: false
  extraArgs: []
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

gpsdExporter:
  enabled: true
  image:
    repository: ghcr.io/brendanbank/gpsd-prometheus-exporter
    tag: "1.1.19"
    pullPolicy: IfNotPresent
  port: 9015
  gpsdHost: localhost
  gpsdPort: 2947
  # '::' binds dual-stack, '0.0.0.0' IPv4 only.
  listenAddress: "::"
  # Per-satellite series carry the gnssid label, which is what makes
  # per-constellation (GPS/Galileo/GLONASS/BeiDou) health visible.
  # Set to true to drop them if cardinality becomes a problem.
  disableSatelliteMonitoring: false
  # Needs /dev/pps0 inside the container. chrony's PPS refclock is the
  # authoritative offset measurement, so this stays off.
  ppsHistogram: false
  # Track position scatter from a fixed point: useful antenna-health and
  # spoofing signal for a stationary receiver. Set lat/lon to the real antenna
  # position at install time; they are deliberately not committed here.
  geopoint:
    enabled: false
    lat: ""
    lon: ""
  extraArgs: []
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

# Polls the pool.ntp.org score feed. chrony can say how well the local clock is
# disciplined; only the pool's own monitors can say how the server looks from
# the outside. Runs as its own Deployment: it talks to the internet, not to the
# GNSS receiver, so it does not belong on the timekeeping node.
poolExporter:
  enabled: false
  image:
    repository: python
    tag: "3.14-alpine"
    pullPolicy: IfNotPresent
  port: 9126
  # Public addresses of this server exactly as registered in the pool. Left
  # empty on purpose: the address is site-specific and this chart is public.
  servers: []
  # The pool rescores a few times an hour, so polling faster achieves nothing
  # and is impolite. robots.txt allows /scores/ but disallows /monitor/.
  interval: 300
  limit: 400
  # Around 190 monitors report on a well-connected server, which is ~600
  # churning series. Off by default; the exporter emits aggregates instead.
  perMonitor: false
  # Monitors scoring below this are counted in ntppool_monitors_low_total.
  lowScore: 10
  userAgent: ""
  nodeSelector: {}
  tolerations: []
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 96Mi

# Where this server's clients are, by country. chronyd already logs every client
# that has asked it for the time, so this needs no packet capture and no extra
# capability on the timekeeping pod: a sidecar writes `chronyc -n clients` to a
# shared file and the exporter resolves and aggregates it.
#
# Client IP addresses are personal data. They are resolved in memory and never
# exported, logged or written to disk; only per-country counts leave the pod.
clientsExporter:
  enabled: false
  # Reads the dumped client list. Stock python image, standard library only.
  image:
    repository: python
    tag: "3.13-alpine"
    pullPolicy: IfNotPresent
  # Supplies chronyc, which the python image does not have. Alpine based and
  # multi-arch. The publisher tags only `latest`, so it is pinned by digest.
  # Nested under an `image` key so Renovate's helm-values manager finds it.
  dump:
    image:
      repository: cturra/ntp
      tag: "latest"
      digest: "sha256:7224d4e7c7833aabbcb7dd70c46c8a8dcccda365314c6db047b9b10403ace3bc"
      pullPolicy: IfNotPresent
  port: 9127
  interval: 300
  dumpInterval: 300
  # Bounds the first fill: 14k clients would otherwise be 14k lookups in one go.
  maxLookupsPerCycle: 3000
  unknownLabel: unknown
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 128Mi

# IP-to-country lookups, served locally so no client address leaves the cluster.
# The image bundles a recent GeoLite2 database, so there is no MaxMind account,
# licence key or refresh job to manage.
geoipApi:
  enabled: false
  image:
    repository: observabilitystack/geoip-api
    tag: "2026-39"
    pullPolicy: IfNotPresent
  port: 8080
  # This is a GraalVM native image. On a 16 KiB-page kernel it dies immediately
  # with "Failed to create the main Isolate. (code 24)" -- which is every
  # Raspberry Pi 5 (-rpi-2712) node here. It must land on a 4 KiB-page node,
  # which is also where the chrony socket is, so co-locating costs nothing.
  nodeSelector:
    kubernetes.io/hostname: ntp
  tolerations:
    - key: longhorn.io/exclude
      operator: Equal
      value: "true"
      effect: NoSchedule
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      memory: 192Mi

# VMPodScrape for the VictoriaMetrics operator.
scrape:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  # Drop the pod label at scrape time. The pod name is part of a series'
  # identity, so every exporter restart forks every series: graphs break at the
  # restart, palette-classic reassigns colours because series indices shift, and
  # cardinality grows by a full set each time. This DaemonSet pins one pod to
  # one node, so the pod name says nothing that instance, job and node do not.
  dropPodLabel: true

# VMRule with the clock-error recording rule and alerts.
# Off by default: a VMRule needs vmalert to evaluate it, and the
# victoria-metrics-k8s-stack ships with `vmalert.enabled: false`. With no
# evaluator the recording rule never computes and no alert can fire, so the
# object would just sit there. The dashboard computes the clock error bound
# inline instead. Turn this on if you run vmalert.
rules:
  enabled: false
  # Absolute bound on clock accuracy, per the chrony documentation.
  clockErrorAlertSeconds: 0.001
  minSatellitesUsed: 4
  # Refclock that must stay selected for stratum 1.
  refclockSourceName: PPS

# Dashboards are shipped as ConfigMaps for the Grafana sidecar to pick up.
dashboards:
  enabled: true
  label: grafana_dashboard
  labelValue: "1"
  folderAnnotation: grafana_folder
  folder: NTP
