apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "ntp-exporters.fullname" . }}
  labels:
    {{- include "ntp-exporters.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "ntp-exporters.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ntp-exporters.podLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # chronyd and gpsd both listen on loopback only, so the pod has to share
      # the host's network namespace to reach them.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        {{- if .Values.clientsExporter.enabled }}
        fsGroup: {{ .Values.chronyExporter.socket.runAsGroup }}
        {{- end }}
      containers:
        {{- if .Values.chronyExporter.enabled }}
        - name: chrony-exporter
          image: "{{ .Values.chronyExporter.image.repository }}:{{ .Values.chronyExporter.image.tag }}"
          imagePullPolicy: {{ .Values.chronyExporter.image.pullPolicy }}
          args:
            - "--chrony.address={{ .Values.chronyExporter.address }}"
            - "--web.listen-address=:{{ .Values.chronyExporter.port }}"
            - --{{ if not .Values.chronyExporter.collectors.tracking }}no-{{ end }}collector.tracking
            - --{{ if not .Values.chronyExporter.collectors.sources }}no-{{ end }}collector.sources
            - --{{ if not .Values.chronyExporter.collectors.sourcestats }}no-{{ end }}collector.sourcestats
            - --{{ if not .Values.chronyExporter.collectors.serverstats }}no-{{ end }}collector.serverstats
            - --{{ if not .Values.chronyExporter.collectors.clients }}no-{{ end }}collector.clients
            {{- if .Values.chronyExporter.collectors.sourcesWithNtpdata }}
            - --collector.sources.with-ntpdata
            {{- end }}
            {{- with .Values.chronyExporter.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: chrony
              containerPort: {{ .Values.chronyExporter.port }}
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            {{- if .Values.chronyExporter.socket.enabled }}
            runAsUser: {{ .Values.chronyExporter.socket.runAsUser }}
            runAsGroup: {{ .Values.chronyExporter.socket.runAsGroup }}
            {{- end }}
            capabilities:
              drop:
                - ALL
          {{- if .Values.chronyExporter.socket.enabled }}
          volumeMounts:
            - name: chrony-socket
              mountPath: {{ .Values.chronyExporter.socket.hostPath }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /metrics
              port: chrony
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: chrony
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.chronyExporter.resources | nindent 12 }}
        {{- end }}
        {{- if .Values.gpsdExporter.enabled }}
        - name: gpsd-exporter
          image: "{{ .Values.gpsdExporter.image.repository }}:{{ .Values.gpsdExporter.image.tag }}"
          imagePullPolicy: {{ .Values.gpsdExporter.image.pullPolicy }}
          # The image's default CMD is entrypoint.sh, which builds its arguments
          # from environment variables and unconditionally passes
          # --offset-from-geopoint with the coordinates baked into the image.
          # Call the exporter directly so the flags below are the whole story.
          command:
            - python3
            - /app/gpsd_exporter.py
          args:
            - "--hostname={{ .Values.gpsdExporter.gpsdHost }}"
            - "--port={{ .Values.gpsdExporter.gpsdPort }}"
            - "--exporter-port={{ .Values.gpsdExporter.port }}"
            - "--listen-address={{ .Values.gpsdExporter.listenAddress }}"
            {{- if .Values.gpsdExporter.disableSatelliteMonitoring }}
            - --disable-monitor-satellites
            {{- end }}
            {{- if .Values.gpsdExporter.ppsHistogram }}
            - --pps-histogram
            {{- end }}
            {{- if .Values.gpsdExporter.geopoint.enabled }}
            - --offset-from-geopoint
            - --geopoint-lat={{ required "gpsdExporter.geopoint.lat is required when gpsdExporter.geopoint.enabled is true" .Values.gpsdExporter.geopoint.lat }}
            - --geopoint-lon={{ required "gpsdExporter.geopoint.lon is required when gpsdExporter.geopoint.enabled is true" .Values.gpsdExporter.geopoint.lon }}
            {{- end }}
            {{- with .Values.gpsdExporter.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: gpsd
              containerPort: {{ .Values.gpsdExporter.port }}
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /metrics
              port: gpsd
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: gpsd
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.gpsdExporter.resources | nindent 12 }}
        {{- end }}
        {{- if .Values.clientsExporter.enabled }}
        # chronyc lives here and not in the python image. It writes the client
        # list to a shared file; the exporter beside it does the rest.
        - name: chrony-clients-dump
          image: "{{ .Values.clientsExporter.dump.image.repository }}:{{ .Values.clientsExporter.dump.image.tag }}{{ with .Values.clientsExporter.dump.image.digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ .Values.clientsExporter.dump.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              while true; do
                if chronyc -n clients > /var/lib/ntp-clients/.clients.tmp 2>/dev/null; then
                  mv /var/lib/ntp-clients/.clients.tmp /var/lib/ntp-clients/clients.txt
                else
                  echo "chronyc clients failed; keeping the previous dump" >&2
                  rm -f /var/lib/ntp-clients/.clients.tmp
                fi
                sleep {{ .Values.clientsExporter.dumpInterval }}
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: {{ .Values.chronyExporter.socket.runAsUser }}
            runAsGroup: {{ .Values.chronyExporter.socket.runAsGroup }}
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: chrony-socket
              mountPath: {{ .Values.chronyExporter.socket.hostPath }}
            - name: clients-data
              mountPath: /var/lib/ntp-clients
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 48Mi
        - name: clients-exporter
          image: "{{ .Values.clientsExporter.image.repository }}:{{ .Values.clientsExporter.image.tag }}"
          imagePullPolicy: {{ .Values.clientsExporter.image.pullPolicy }}
          command:
            - python3
            - /scripts/clients_exporter.py
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: CLIENTS_FILE
              value: /var/lib/ntp-clients/clients.txt
            - name: CLIENTS_PORT
              value: {{ .Values.clientsExporter.port | quote }}
            - name: CLIENTS_INTERVAL
              value: {{ .Values.clientsExporter.interval | quote }}
            - name: CLIENTS_MAX_LOOKUPS
              value: {{ .Values.clientsExporter.maxLookupsPerCycle | quote }}
            - name: CLIENTS_UNKNOWN_LABEL
              value: {{ .Values.clientsExporter.unknownLabel | quote }}
            - name: GEOIP_URL
              value: "http://{{ include "ntp-exporters.fullname" . }}-geoip.{{ .Release.Namespace }}.svc:{{ .Values.geoipApi.port }}"
          ports:
            - name: clients
              containerPort: {{ .Values.clientsExporter.port }}
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: clients-script
              mountPath: /scripts
              readOnly: true
            - name: clients-data
              mountPath: /var/lib/ntp-clients
              readOnly: true
          readinessProbe:
            httpGet:
              path: /metrics
              port: clients
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.clientsExporter.resources | nindent 12 }}
        {{- end }}
      {{- if and .Values.chronyExporter.enabled .Values.chronyExporter.socket.enabled }}
      volumes:
        - name: chrony-socket
          hostPath:
            path: {{ .Values.chronyExporter.socket.hostPath }}
            type: Directory
      {{- end }}
      {{- if .Values.clientsExporter.enabled }}
        - name: clients-script
          configMap:
            name: {{ include "ntp-exporters.fullname" . }}-clients-script
        - name: clients-data
          emptyDir: {}
      {{- end }}
