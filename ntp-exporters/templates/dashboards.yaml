{{- if .Values.dashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ntp-exporters.fullname" . }}-dashboard-chrony
  labels:
    {{- include "ntp-exporters.labels" . | nindent 4 }}
    {{ .Values.dashboards.label }}: {{ .Values.dashboards.labelValue | quote }}
  annotations:
    {{ .Values.dashboards.folderAnnotation }}: {{ .Values.dashboards.folder | quote }}
data:
  ntp-chrony-gnss.json: |-
{{ .Files.Get "files/chrony-dashboard.json" | replace "__NODE_NAME__" (index .Values.nodeSelector "kubernetes.io/hostname" | default "") | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ntp-exporters.fullname" . }}-dashboard-gpsd
  labels:
    {{- include "ntp-exporters.labels" . | nindent 4 }}
    {{ .Values.dashboards.label }}: {{ .Values.dashboards.labelValue | quote }}
  annotations:
    {{ .Values.dashboards.folderAnnotation }}: {{ .Values.dashboards.folder | quote }}
data:
  gpsd.json: |-
{{ .Files.Get "files/gpsd-dashboard.json" | indent 4 }}
{{- end }}
